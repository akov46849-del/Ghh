<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест записи REST</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f0c29; color: #fff; }
        .container { max-width: 400px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; }
        button { width: 100%; padding: 15px; background: #f5576c; border: none; border-radius: 30px; color: #fff; font-size: 18px; cursor: pointer; }
        #log { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧪 Тест записи через REST</h2>
    <button id="btn">Отправить тест</button>
    <div id="log">Ожидание...</div>
</div>

<script>
    const logDiv = document.getElementById('log');

    function logMessage(text, isError = false) {
        logDiv.textContent = text;
        logDiv.style.borderLeft = isError ? '4px solid #f5576c' : '4px solid #4ade80';
    }

    document.getElementById('btn').addEventListener('click', function() {
        logMessage('⏳ Отправка...');
        const url = 'https://zing-4a547-default-rtdb.europe-west1.firebasedatabase.app/emailQueue.json';
        const data = {
            email: 'test-rest@example.com',
            status: 'pending',
            timestamp: Date.now()
        };

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(result => {
            logMessage('✅ Запись создана! ID: ' + result.name);
        })
        .catch(err => {
            logMessage('❌ Ошибка: ' + err.message, true);
        });
    });
</script>
</body>
</html>
