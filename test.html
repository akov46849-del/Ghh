<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест записи Firebase</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f0c29; color: #fff; }
        .container { max-width: 400px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; }
        button { width: 100%; padding: 15px; background: #f5576c; border: none; border-radius: 30px; color: #fff; font-size: 18px; cursor: pointer; }
        #log { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
        .success { border-left: 4px solid #4ade80; }
        .error { border-left: 4px solid #f5576c; }
    </style>
</head>
<body>
<div class="container">
    <h2>🧪 Тест записи в очередь</h2>
    <p>Нажмите кнопку, чтобы отправить тестовый запрос в Firebase.</p>
    <button id="btn">Отправить тест</button>
    <div id="log">Ожидание нажатия...</div>
</div>

<script>
    // ===== ВАШ КОНФИГ FIREBASE =====
    const firebaseConfig = {
        apiKey: "AIzaSyBjJ0U5hcGDmxrWKKa0RvTK3d9q5FvgHIk",
        authDomain: "zing-4a547.firebaseapp.com",
        projectId: "zing-4a547",
        storageBucket: "zing-4a547.firebasestorage.app",
        messagingSenderId: "1030163494482",
        appId: "1:1030163494482:web:ede622e8b1f6859714518b"
    };

    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const logDiv = document.getElementById('log');

    function logMessage(text, isError = false) {
        logDiv.textContent = text;
        logDiv.className = isError ? 'error' : 'success';
    }

    document.getElementById('btn').addEventListener('click', function() {
        logMessage('⏳ Отправка...');
        const ref = db.ref('emailQueue').push();
        ref.set({
            email: 'test@example.com',
            status: 'pending',
            timestamp: Date.now()
        })
        .then(() => {
            logMessage('✅ Запись создана! ID: ' + ref.key + '\nПроверьте Firebase → emailQueue');
        })
        .catch((err) => {
            logMessage('❌ Ошибка: ' + err.message + '\nКод: ' + err.code, true);
        });
    });
</script>
</body>
</html>
