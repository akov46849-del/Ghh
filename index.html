<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZING — вход по ссылке</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 span {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #f5576c;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.15);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.4);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .message {
            margin-top: 20px;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #f5576c;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .message.show {
            display: flex;
        }
        .message.success {
            border-left-color: #4ade80;
        }
        .message .icon {
            font-size: 22px;
        }
        #userInfo {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
        }
        #userInfo .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 24px rgba(245, 87, 108, 0.3);
        }
        #userInfo .email {
            color: #fff;
            font-size: 18px;
            font-weight: 500;
        }
        #userInfo .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        #userInfo .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #authBox {
            display: block;
        }
        .footer {
            margin-top: 28px;
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Блок входа -->
        <div id="authBox">
            <h1>⚡ <span>ZING</span></h1>
            <p class="sub">Мгновенный вход по ссылке</p>

            <div class="input-group">
                <label>Ваша почта</label>
                <input type="email" id="emailInput" placeholder="hello@example.com" autocomplete="email">
            </div>

            <button class="btn" id="sendLinkBtn">
                <span id="btnText">Отправить ссылку</span>
                <div class="spinner" id="spinner" style="display:none;"></div>
            </button>

            <div class="message" id="messageBox">
                <span class="icon">✉️</span>
                <span id="messageText">Проверьте почту, мы отправили ссылку для входа.</span>
            </div>
            <div class="footer">ZING — безопасно и быстро</div>
        </div>

        <!-- Блок после входа -->
        <div id="userInfo">
            <div class="avatar" id="userAvatar">👤</div>
            <div class="email" id="userEmail">user@example.com</div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <script>
        // ===== ВАШ КОНФИГ FIREBASE (УЖЕ ВСТАВЛЕН) =====
        const firebaseConfig = {
            apiKey: "AIzaSyBjJ0U5hcGDmxrWKKa0RvTK3d9q5FvgHIk",
            authDomain: "zing-4a547.firebaseapp.com",
            projectId: "zing-4a547",
            storageBucket: "zing-4a547.firebasestorage.app",
            messagingSenderId: "1030163494482",
            appId: "1:1030163494482:web:ede622e8b1f6859714518b"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM-элементы
        const emailInput = document.getElementById('emailInput');
        const sendBtn = document.getElementById('sendLinkBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        const authBox = document.getElementById('authBox');
        const userInfo = document.getElementById('userInfo');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        // Базовый URL (ваш GitHub Pages)
        const baseUrl = window.location.origin + window.location.pathname.split('?')[0];

        // --- Обработка входа по ссылке ---
        if (window.location.search.includes('mode=signIn')) {
            const link = window.location.href;
            const email = localStorage.getItem('emailForSignIn');
            if (email && auth.isSignInWithEmailLink(link)) {
                auth.signInWithEmailLink(email, link)
                    .then((result) => {
                        localStorage.removeItem('emailForSignIn');
                        showUser(result.user);
                        window.history.replaceState({}, document.title, baseUrl);
                    })
                    .catch((error) => {
                        showMessage('Ошибка: ' + error.message, false);
                    });
            } else {
                showMessage('Ссылка недействительна или истекла.', false);
            }
        }

        // --- Отправка ссылки ---
        sendBtn.addEventListener('click', () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                showMessage('Введите корректный email.', false);
                return;
            }

            localStorage.setItem('emailForSignIn', email);

            sendBtn.disabled = true;
            btnText.textContent = 'Отправка...';
            spinner.style.display = 'inline-block';
            messageBox.classList.remove('show');

            // Имитация загрузки 3 секунды
            setTimeout(() => {
                const actionCodeSettings = {
                    url: baseUrl,
                    handleCodeInApp: true
                };

                auth.sendSignInLinkToEmail(email, actionCodeSettings)
                    .then(() => {
                        btnText.textContent = 'Отправлено! ✅';
                        spinner.style.display = 'none';
                        sendBtn.disabled = false;
                        showMessage('✉️ Ссылка отправлена на вашу почту. Перейдите по ней, чтобы войти.',
                            true);
                        setTimeout(() => {
                            btnText.textContent = 'Отправить ссылку';
                        }, 3000);
                    })
                    .catch((error) => {
                        btnText.textContent = 'Отправить ссылку';
                        spinner.style.display = 'none';
                        sendBtn.disabled = false;
                        showMessage('Ошибка: ' + error.message, false);
                    });
            }, 3000);
        });

        // --- Выход ---
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                userInfo.style.display = 'none';
                authBox.style.display = 'block';
                emailInput.value = '';
            });
        });

        // --- Показать пользователя ---
        function showUser(user) {
            authBox.style.display = 'none';
            userInfo.style.display = 'flex';
            userEmail.textContent = user.email;
            const initial = user.email.charAt(0).toUpperCase();
            document.getElementById('userAvatar').textContent = initial;
        }

        // --- Показать сообщение ---
        function showMessage(text, isSuccess = true) {
            messageBox.className = 'message show';
            if (isSuccess) {
                messageBox.classList.add('success');
                messageBox.querySelector('.icon').textContent = '✅';
            } else {
                messageBox.classList.remove('success');
                messageBox.querySelector('.icon').textContent = '⚠️';
            }
            messageText.textContent = text;
        }

        // --- Состояние авторизации ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                showUser(user);
            } else {
                authBox.style.display = 'block';
                userInfo.style.display = 'none';
            }
        });
    </script>
</body>
</html>
